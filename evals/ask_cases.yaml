# Eval cases for the Ask agent. Every check here is done by code (jobfinder/evals.py).
#
#   filters:        the agent's last search must include these (search_jobs' names and values)
#   not_filters:    no search may use these: catches filters nobody asked for (profile leaks)
#   picks_match:    every job it shows must match `filters`, checked in the database
#   states_total:   the answer must contain the true number of matching jobs
#   no_jobs:        the answer must show no jobs
# Every case also checks: answered in English, and no internal parameter names in the answer.
#
# Most come from the hand cross-check of 2026-10-24; the comment says what went wrong then.

- id: remote
  question: completely remote
  filters: {remote_only: true}
  not_filters: [min_pay_lpa, employment_types, levels]
  picks_match: true
  states_total: true            # showed 3 of 448, never said how many

- id: remote-plain
  question: remote jobs
  filters: {remote_only: true}
